services:
  - type: web
    name: village-api
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: USE_REDIS
        value: "true"
      - key: PYTHON_VERSION
        value: "3.11.5"
    disk:
      name: data
      mountPath: /data
      sizeGB: 1

databases:
  - name: village-db
    databaseName: villages_db
    user: postgres
    plan: free

  - name: village-cache
    plan: free
